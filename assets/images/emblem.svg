<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72" fill="none" aria-hidden="true">
  <!-- Sunburst rays (gold, fixed color) -->
  <g stroke="#cf9d47" stroke-linecap="round">
    <line x1="47" y1="7"  x2="52" y2="2"  stroke-width="1.6"/>
    <line x1="52" y1="14" x2="58" y2="12" stroke-width="1.6"/>
    <line x1="53" y1="22" x2="59" y2="21" stroke-width="1.6"/>
    <line x1="52" y1="30" x2="58" y2="32" stroke-width="1.6"/>
    <line x1="48" y1="37" x2="53" y2="41" stroke-width="1.6"/>
    <path d="M 42 8 A 15 15 0 0 1 53 36" stroke-width="2" fill="none"/>
  </g>
  <!-- Globe circle (currentColor — adapts to dark/light) -->
  <circle cx="25" cy="23" r="17" stroke="currentColor" stroke-width="2"/>
  <!-- Equatorial ellipse -->
  <ellipse cx="25" cy="23" rx="17" ry="6" stroke="currentColor" stroke-width="1.3"/>
  <!-- Central meridian -->
  <ellipse cx="25" cy="23" rx="6" ry="17" stroke="currentColor" stroke-width="1.3"/>
  <!-- Latitude guide lines -->
  <line x1="8.5"  y1="17" x2="41.5" y2="17" stroke="currentColor" stroke-width="0.9"/>
  <line x1="8"    y1="29" x2="42"   y2="29" stroke="currentColor" stroke-width="0.9"/>
  <!-- Stand -->
  <line x1="25" y1="40" x2="25" y2="45" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="19" y1="45" x2="31" y2="45" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Book 1 (top) -->
  <rect x="12" y="47" width="26" height="5"  rx="0.5" stroke="currentColor" stroke-width="1.6"/>
  <line x1="15" y1="47" x2="15" y2="52" stroke="currentColor" stroke-width="0.9"/>
  <!-- Book 2 (middle) -->
  <rect x="10" y="52" width="30" height="5"  rx="0.5" stroke="currentColor" stroke-width="1.6"/>
  <line x1="13" y1="52" x2="13" y2="57" stroke="currentColor" stroke-width="0.9"/>
  <!-- Book 3 (bottom) -->
  <rect x="8"  y="57" width="34" height="6"  rx="0.5" stroke="currentColor" stroke-width="1.6"/>
  <line x1="11" y1="57" x2="11" y2="63" stroke="currentColor" stroke-width="0.9"/>
</svg>
